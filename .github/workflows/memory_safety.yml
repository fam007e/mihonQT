name: Memory Safety Check

permissions:
  contents: read

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'CMakeLists.txt'
      - 'vcpkg.json'
      - 'cmake/**'
      - 'resources.qrc'
      - '.github/workflows/memory_safety.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'CMakeLists.txt'
      - 'vcpkg.json'
      - 'cmake/**'
      - 'resources.qrc'
      - '.github/workflows/memory_safety.yml'

jobs:
  build-and-sanitize:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake qt6-base-dev qt6-webengine-dev qt6-declarative-dev qt6-5compat-dev libxkbcommon-dev libgl1-mesa-dev cppcheck libquazip1-qt6-dev

    - name: Configure CMake with AddressSanitizer
      run: >
        cmake -B build -S .
        -DCMAKE_BUILD_TYPE=Debug
        -DCMAKE_CXX_FLAGS="-fsanitize=address -g"
        -DCMAKE_C_FLAGS="-fsanitize=address -g"

    - name: Build project
      run: cmake --build build

    - name: Run Flawfinder security scan
      run: |
        flawfinder --minlevel=1 --quiet --dataonly src/ || true

    - name: Run CppCheck static analysis
      run: |
        cppcheck --enable=all --suppressions-list=.cppcheck --quiet --error-exitcode=0 src/

    - name: Run tests (if any)
      # Add a step here to run your test suite
      # For example: ctest --test-dir build
      run: echo "No tests to run"
