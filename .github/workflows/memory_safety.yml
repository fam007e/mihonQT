name: Memory Safety Check

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'CMakeLists.txt'
      - 'vcpkg.json'
      - 'cmake/**'
      - 'resources.qrc'
      - '.github/workflows/memory_safety.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'CMakeLists.txt'
      - 'vcpkg.json'
      - 'cmake/**'
      - 'resources.qrc'
      - '.github/workflows/memory_safety.yml'

# Supersede in-flight runs on rapid pushes: the latest commit's analysis
# is the only one that matters, and cancelling avoids runner pile-ups.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-sanitize:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake qt6-base-dev qt6-webengine-dev qt6-declarative-dev qt6-5compat-dev libxkbcommon-dev libgl1-mesa-dev cppcheck libquazip1-qt6-dev libgumbo-dev libwebp-dev

    - name: Configure CMake with AddressSanitizer
      run: >
        cmake -B build -S .
        -DCMAKE_BUILD_TYPE=Debug
        -DCMAKE_CXX_FLAGS="-fsanitize=address -g"
        -DCMAKE_C_FLAGS="-fsanitize=address -g"

    - name: Build project
      run: cmake --build build

    - name: Run Flawfinder security scan
      run: |
        flawfinder --minlevel=1 --quiet --dataonly src/ || true

    - name: Run CppCheck static analysis
      run: |
        cppcheck --enable=all --suppressions-list=.cppcheck --quiet --error-exitcode=0 src/

    - name: Run tests
      env:
        QT_QPA_PLATFORM: offscreen
        # ASan leak-at-exit flags Qt/global singletons; use-after-free and
        # other runtime checks stay enabled.
        ASAN_OPTIONS: detect_leaks=0
      run: |
        cd build
        ctest --output-on-failure
